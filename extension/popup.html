<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>MetricLens 指标速查</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <input id="q" type="search" placeholder="搜索指标，如 eCPM / 回收率 / 归因" autofocus autocomplete="off">
  </header>

  <main id="list" class="list"></main>

  <section id="detail" class="detail" hidden>
    <div class="dt-head">
      <button id="back" class="linkbtn">&#8592; 返回</button>
      <span id="dt-domain" class="domain"></span>
    </div>
    <h2 id="dt-name"></h2>
    <div id="dt-body" class="full"></div>
  </section>

  <footer>
    <label class="sw"><input type="checkbox" id="enabled"> 划词即查</label>
    <label class="sw"><input type="checkbox" id="autoHighlight"> 自动高亮页面名词</label>
    <div class="meta">
      <span id="ver"></span>
      <button id="sync" class="linkbtn">检查更新</button>
    </div>
  </footer>

  <script src="lib/dict.js"></script>
  <script src="lib/md.js"></script>
  <script src="popup.js"></script>
</body>
</html>
